    <style>
        .profile-img { width: 100%; max-width: 200px; height: 250px; object-fit: cover; border-radius: 10px; border: 3px solid var(--bs-border-color); margin-bottom: 15px; }
        .info-label { font-size: 13px; color: var(--bs-secondary-color); font-weight: 600; margin-bottom: 2px; }
        .info-value { font-size: 15px; font-weight: bold; margin-bottom: 15px; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .profile-img { background: #e9ecef; }

        /* Timeline Styles */
        .timeline { position: relative; padding-left: 30px; margin-top: 20px; }
        .timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background-color: var(--bs-border-color); border-radius: 3px; }

        .timeline-item { position: relative; margin-bottom: 30px; }
        .timeline-marker { position: absolute; left: -36px; top: 0; width: 15px; height: 15px; border-radius: 50%; background-color: var(--bs-primary); border: 3px solid var(--bs-card-bg); box-shadow: 0 0 0 2px var(--bs-primary); z-index: 1; }
        .timeline-marker.status-verified { background-color: #2ecc71; box-shadow: 0 0 0 2px #2ecc71; }
        .timeline-marker.status-invalid { background-color: #e74c3c; box-shadow: 0 0 0 2px #e74c3c; }
        .timeline-marker.status-pending { background-color: #f1c40f; box-shadow: 0 0 0 2px #f1c40f; }

        .timeline-content { background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); border-radius: 8px; padding: 15px; position: relative; }
        .timeline-content::before { content: ''; position: absolute; left: -8px; top: 5px; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-right: 8px solid var(--bs-border-color); }
        .timeline-content::after { content: ''; position: absolute; left: -7px; top: 6px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid var(--bs-tertiary-bg); }

        .clue-img { max-width: 100%; max-height: 150px; border-radius: 6px; margin-top: 10px; cursor: pointer; border: 1px solid var(--bs-border-color); }
    </style>
</head>

    <script>
        const session = App.getSession();
        const isAdmin = session && session.role === 'admin';
        const caseId = new URLSearchParams(location.search).get('id');
        const S = App.CASE_STATUS;

        // ลำดับสถานะที่ Backend อนุญาต (allowedTransitions ใน missing.route.js)
        const TRANSITIONS = {
            [S.RECEIVED]:   [{ to: S.REVIEWING, endpoint: 'start-review', label: 'เริ่มตรวจสอบข้อมูล', icon: 'fa-magnifying-glass-chart', cls: 'btn-info' }],
            [S.REVIEWING]:  [{ to: S.SEARCHING, endpoint: 'start-search', label: 'เริ่มค้นหา / ประกาศโพสต์หา', icon: 'fa-bullhorn', cls: 'btn-warning' }],
            [S.SEARCHING]:  [{ to: S.FOUND_SAFE, endpoint: 'found-safe', label: 'พบเจอ - ปลอดภัย', icon: 'fa-circle-check', cls: 'btn-success' },
                             { to: S.FOUND_DEAD, endpoint: 'found-dead', label: 'พบเจอ - เสียชีวิต', icon: 'fa-ribbon', cls: 'btn-dark' }],
            [S.FOUND_SAFE]: [{ to: S.CLOSED, endpoint: 'close', label: 'ปิดเคส', icon: 'fa-folder-closed', cls: 'btn-secondary' }],
            [S.FOUND_DEAD]: [{ to: S.CLOSED, endpoint: 'close', label: 'ปิดเคส', icon: 'fa-folder-closed', cls: 'btn-secondary' }],
            [S.CLOSED]:     [{ to: S.RESUMED, endpoint: 'resume-search', label: 'กลับมาค้นหาอีกครั้ง', icon: 'fa-rotate-right', cls: 'btn-outline-warning' }],
            [S.RESUMED]:    [{ to: S.SEARCHING, endpoint: 'start-search', label: 'เริ่มค้นหาอีกครั้ง', icon: 'fa-bullhorn', cls: 'btn-warning' }],
        };

        const esc = App.escapeHtml;
        const t = (v, f) => App.textOr(v, f);
        let pendingAction = null;

        // ญาติเห็นเลขเอกสารแบบปิดบางส่วน
        function maskIdentity(identity) {
            const s = t(identity, '');
            if (!s || isAdmin) return s || '-';
            const idx = s.indexOf(':');
            const type = idx >= 0 ? s.slice(0, idx + 1) : '';
            const num = idx >= 0 ? s.slice(idx + 1) : s;
            const total = (num.match(/[0-9A-Za-z]/g) || []).length;
            let seen = 0;
            const masked = num.replace(/[0-9A-Za-z]/g, ch => (++seen > total - 3 ? ch : 'X'));
            return `${type}${masked}`.trim();
        }

        function info(label, value, cls) {
            return `<div class="${cls || 'col-12'}"><div class="info-label">${esc(label)}</div><div class="info-value">${value}</div></div>`;
        }

        function renderProfile(c) {
            const name = App.fullName(c.missingperson_title, c.missingperson_name);
            const age = t(c.missingperson_age, '');
            const meta = [age !== '' ? `อายุ ${age} ปี` : '', t(c.missingperson_gender, '') ? `เพศ ${t(c.missingperson_gender)}` : '']
                .filter(Boolean).join(' • ') || 'ไม่ระบุอายุ/เพศ';
            const time = App.formatTime(c.Last_Seen_time);
            const lastSeenWhen = `${App.formatThaiDate(c.Last_Seen_date, { month: 'long' })}${time ? ` เวลา ${time}` : ''}`;
            const place = [t(c.Last_Seen_place, ''),
                t(c.Last_Seen_subdistrict, '') && `ต.${t(c.Last_Seen_subdistrict)}`,
                t(c.Last_Seen_district, '') && `อ.${t(c.Last_Seen_district)}`,
                t(c.Last_Seen_province, '') && `จ.${t(c.Last_Seen_province)}`].filter(Boolean).join(' ') || '-';
            const causes = App.parseCauses(c.case_missing_reason);
            const causesHtml = causes.length
                ? `<ol class="mb-0 ps-3">${causes.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '-';
            const station = t(c.policestation_name, '');
            const stationHtml = station
                ? `${esc(station)}${t(c.policestation_province, '') ? ` (จ.${esc(c.policestation_province)})` : ''}${t(c.policestation_phone, '') ? `<div class="small fw-normal"><i class="fa-solid fa-phone me-1"></i><a href="tel:${esc(App.digitsOnly(c.policestation_phone))}">${esc(c.policestation_phone)}</a></div>` : ''}`
                : '-';
            const height = t(c.character_height_cm, '');

            document.getElementById('profileCard').innerHTML = `
                <div class="text-center">
                    <img src="${esc(App.imageUrl(c.character_image_url))}" ${App.imgFallbackAttr()} class="profile-img" alt="ภาพบุคคลสูญหาย">
                    <h5 class="fw-bold text-primary mb-1">${esc(name)}</h5>
                    <p class="text-body-secondary small mb-3">${esc(meta)}</p>
                    <div class="d-flex justify-content-center flex-wrap gap-1 mb-4">
                        ${App.statusBadge(c.case_latest_status, 'status-badge')}
                        ${App.priorityBadge(c.case_priority, 'status-badge')}
                    </div>
                </div>

                <h6 class="fw-bold border-bottom pb-2"><i class="fa-solid fa-circle-info"></i> ข้อมูลการสูญหาย</h6>
                <div class="row mt-3">
                    ${info('วันเวลาที่หาย', esc(lastSeenWhen))}
                    ${info('สถานที่พบเห็นล่าสุด', esc(place))}
                    ${info('สาเหตุเบื้องต้น (เรียงตามลำดับ)', `<span class="text-danger">${causesHtml}</span>`)}
                    ${info('วันที่รับแจ้ง', esc(App.formatThaiDate(c.case_received_date, { month: 'long', withTime: true })))}
                </div>

                <h6 class="fw-bold border-bottom pb-2 mt-2"><i class="fa-solid fa-dna"></i> รูปพรรณสัณฐาน</h6>
                <div class="row mt-3">
                    ${info('ส่วนสูง', height !== '' ? `${esc(height)} ซม.` : '-', 'col-6')}
                    ${info('สีผิว', esc(t(c.character_skin_color)), 'col-6')}
                    ${info('รูปร่าง', esc(t(c.character_body_shape)), 'col-6')}
                    ${info('ลักษณะผม', esc(t(c.character_hair_style)), 'col-6')}
                    ${info('สีผม', esc(t(c.character_hair_color)), 'col-6')}
                    ${info('สัญชาติ', esc(t(c.missingperson_race)), 'col-6')}
                    ${info('วันเกิด', esc(App.formatThaiDate(c.missingperson_birthday, { month: 'long' })), 'col-12')}
                    ${info('เอกสารยืนยันตัวตน', esc(maskIdentity(c.missingperson_identity)), 'col-12')}
                </div>

                <h6 class="fw-bold border-bottom pb-2 mt-2"><i class="fa-solid fa-building-shield"></i> ข้อมูลคดี</h6>
                <div class="row mt-3">
                    ${info('สถานีตำรวจรับผิดชอบ', stationHtml)}
                    ${info('ความสัมพันธ์ของผู้แจ้งกับผู้สูญหาย', esc(t(c.case_relation_to_missing)))}
                    ${t(c.case_notes, '') ? info('บันทึกเพิ่มเติม', `<span class="fw-normal" style="white-space: pre-line;">${esc(c.case_notes)}</span>`) : ''}
                </div>`;
        }

        function markerClass(status) {
            if (status === S.FOUND_SAFE) return 'status-verified';
            if (status === S.FOUND_DEAD) return 'status-invalid';
            if (status === S.CLOSED) return '';
            return 'status-pending';
        }

        function renderTimeline(logs) {
            const box = document.getElementById('timeline');
            const list = (Array.isArray(logs) ? logs : []).slice().sort((a, b) =>
                (App.toDate(b.log_logged_date) || 0) - (App.toDate(a.log_logged_date) || 0) || (b.log_id - a.log_id));
            if (list.length === 0) {
                App.renderState(box, 'empty', 'ยังไม่มีประวัติการเปลี่ยนสถานะ');
                return;
            }
            box.innerHTML = list.map((log, i) => `
                <div class="timeline-item">
                    <div class="timeline-marker ${markerClass(log.log_case_status)}"></div>
                    <div class="timeline-content ${i === 0 ? 'bg-body border-primary border-2' : ''}">
                        <div class="d-flex justify-content-between align-items-start mb-2 flex-wrap gap-2">
                            <h6 class="fw-bold m-0 text-primary">${App.statusBadge(log.log_case_status)}</h6>
                            ${i === 0 ? '<span class="badge bg-primary">ล่าสุด</span>' : ''}
                        </div>
                        <p class="text-body-secondary small mb-2"><i class="fa-solid fa-calendar-days"></i>
                            ${esc(App.formatThaiDate(log.log_logged_date, { month: 'long', withTime: true }))}
                            ${t(log.log_logged_by, '') ? ` • โดย ${esc(log.log_logged_by)}` : ''}</p>
                        <p class="m-0">${esc(t(log.log_description))}</p>
                    </div>
                </div>`).join('');
        }

        function renderPoliceReports(reports) {
            const box = document.getElementById('policeReports');
            const list = Array.isArray(reports) ? reports : [];
            if (list.length === 0) {
                App.renderState(box, 'empty', 'ยังไม่มีใบแจ้งความในเคสนี้');
                return;
            }
            box.innerHTML = list.map(r => {
                const doc = t(r.policereport_document, '');
                const time = App.formatTime(r.policereport_time);
                return `
                <div class="border rounded p-3 mb-3">
                    <div class="row g-3">
                        <div class="${doc ? 'col-md-8' : 'col-12'}">
                            <div class="row">
                                ${info('เลขที่ใบแจ้งความ', esc(t(r.policereport_number)), 'col-sm-6')}
                                ${info('วันเวลาที่แจ้ง', esc(`${App.formatThaiDate(r.policereport_date, { month: 'long' })}${time ? ` ${time}` : ''}`), 'col-sm-6')}
                                ${info('สถานที่แจ้ง (สน./สภ.)', esc(t(r.policereport_location)), 'col-sm-6')}
                                ${info('เจ้าหน้าที่ตำรวจผู้รับแจ้ง', esc(t(r.policereport_name)), 'col-sm-6')}
                                ${info('รายละเอียด / วัตถุประสงค์', `<span class="fw-normal" style="white-space: pre-line;">${esc(t(r.policereport_purpose))}</span>`)}
                            </div>
                        </div>
                        ${doc ? `<div class="col-md-4 text-center">
                            <a href="${esc(App.imageUrl(doc))}" target="_blank" rel="noopener" title="เปิดเอกสารฉบับเต็ม">
                                <img src="${esc(App.imageUrl(doc))}" ${App.imgFallbackAttr()} class="clue-img" alt="ภาพใบแจ้งความ">
                            </a>
                            <div class="small mt-1"><a href="${esc(App.imageUrl(doc))}" target="_blank" rel="noopener">เปิดเอกสาร <i class="fa-solid fa-up-right-from-square"></i></a></div>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function renderStatusActions(c) {
            const card = document.getElementById('statusCard');
            if (!isAdmin) { card.remove(); return; }
            card.classList.remove('d-none');
            document.getElementById('currentStatusBadge').innerHTML = App.statusBadge(c.case_latest_status);
            const actions = TRANSITIONS[c.case_latest_status] || [];
            const box = document.getElementById('statusActions');
            box.innerHTML = actions.length
                ? actions.map((a, i) => `<button type="button" class="btn ${a.cls} btn-sm fw-bold" data-action="${i}"><i class="fa-solid ${a.icon} me-1"></i>${esc(a.label)}</button>`).join('')
                : '<span class="text-body-secondary small">ไม่มีขั้นตอนถัดไปสำหรับสถานะนี้</span>';
            box.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => {
                pendingAction = actions[+btn.dataset.action];
                document.getElementById('statusConfirmText').innerHTML =
                    `ยืนยันเปลี่ยนสถานะเป็น ${App.statusBadge(pendingAction.to)} ?`;
                document.getElementById('statusDescription').value = '';
                document.getElementById('statusError').classList.add('d-none');
                document.getElementById('statusConfirm').classList.remove('d-none');
                document.getElementById('statusDescription').focus();
            }));
        }

        document.getElementById('statusCancelBtn').addEventListener('click', () => {
            pendingAction = null;
            document.getElementById('statusConfirm').classList.add('d-none');
        });

        document.getElementById('statusConfirmBtn').addEventListener('click', async () => {
            if (!pendingAction) return;
            const btn = document.getElementById('statusConfirmBtn');
            const errBox = document.getElementById('statusError');
            errBox.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังบันทึก...';
            try {
                const description = document.getElementById('statusDescription').value.trim();
                const res = await App.api(`/cases/${encodeURIComponent(caseId)}/${pendingAction.endpoint}`, {
                    method: 'POST',
                    json: { logged_by: (session && session.name) || 'เจ้าหน้าที่', ...(description ? { description } : {}) },
                });
                App.toast(res.message || 'อัปเดตสถานะเรียบร้อยแล้ว', 'success');
                pendingAction = null;
                document.getElementById('statusConfirm').classList.add('d-none');
                await loadCase(true);
            } catch (err) {
                console.error('อัปเดตสถานะไม่สำเร็จ:', err);
                errBox.textContent = `อัปเดตสถานะไม่สำเร็จ: ${err.message}`;
                errBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.textContent = 'ยืนยัน';
            }
        });

        // GET /api/cases/:id → { success, case, status_logs, police_reports }
        async function loadCase(silent) {
            const stateBox = document.getElementById('pageState');
            const content = document.getElementById('caseContent');
            if (!caseId || !/^\d+$/.test(caseId)) {
                App.renderState(stateBox, 'error', 'ไม่พบรหัสเคสในลิงก์ กรุณาเลือกเคสจากหน้ารายการเคส');
                return;
            }
            document.getElementById('header_case_id').textContent = caseId;
            document.getElementById('addClueLink').href = `add-clue.html?case_id=${encodeURIComponent(caseId)}`;
            if (!silent) {
                content.classList.add('d-none');
                App.renderState(stateBox, 'loading', 'กำลังโหลดรายละเอียดเคส...');
            }
            try {
                const data = await App.api(`/cases/${encodeURIComponent(caseId)}`);
                // รองรับทั้งรูปแบบ { case, status_logs, police_reports } และแบบส่งแถวเคสตรงๆ
                const c = (data && data.case) ? data.case : data;
                if (!c || c.case_id === undefined) throw new App.ApiError('ข้อมูลเคสที่ได้รับไม่ถูกต้อง', 200, data);
                let logs = data.status_logs;
                if (!Array.isArray(logs)) {
                    try { logs = (await App.api(`/cases/${encodeURIComponent(caseId)}/status-logs`)).status_logs; }
                    catch (e) { console.warn('โหลดประวัติสถานะไม่สำเร็จ:', e); logs = []; }
                }
                document.title = `เคส ${c.case_id} - ${App.fullName(c.missingperson_title, c.missingperson_name)} - Thai PBS Center`;
                renderProfile(c);
                renderTimeline(logs);
                renderPoliceReports(data.police_reports);
                renderStatusActions(c);
                stateBox.innerHTML = '';
                content.classList.remove('d-none');
            } catch (err) {
                console.error('GET /api/cases/:id ล้มเหลว:', err);
                if (silent) { App.toast(`โหลดข้อมูลล่าสุดไม่สำเร็จ: ${err.message}`, 'danger'); return; }
                const msg = err.status === 404 ? 'ไม่พบเคสนี้ในระบบ' : `โหลดรายละเอียดเคสไม่สำเร็จ: ${err.message}`;
                App.renderState(stateBox, 'error', msg, err.status === 404 ? {} : { onRetry: () => loadCase() });
            }
        }

        loadCase();
    </script>
</body>
</html>
