    <script src="policeData.js"></script>
    <script>
        const PAGE_SIZE = 10;
        const COLS = 5;
        let allCases = [];
        let currentPage = 1;
        let requestSeq = 0;

        const els = {
            form: document.getElementById('filterForm'),
            search: document.getElementById('f_search'),
            status: document.getElementById('f_status'),
            priority: document.getElementById('f_priority'),
            province: document.getElementById('f_province'),
            body: document.getElementById('casesBody'),
            summary: document.getElementById('resultSummary'),
            pagination: document.getElementById('pagination'),
        };

        // รายชื่อ 77 จังหวัด (policeData.js)
        if (typeof allThaiProvincesList !== 'undefined') {
            [...allThaiProvincesList].sort((a, b) => a.localeCompare(b, 'th')).forEach(prov => {
                els.province.insertAdjacentHTML('beforeend', `<option value="${App.escapeHtml(prov)}">${App.escapeHtml(prov)}</option>`);
            });
        }

        function currentFilters() {
            return {
                search: els.search.value.trim(),
                status: els.status.value,
                priority: els.priority.value,
                province: els.province.value,
            };
        }

        // เก็บตัวกรองไว้ใน URL เพื่อให้กดย้อนกลับ/แชร์ลิงก์ได้
        function syncUrl(filters) {
            const qs = new URLSearchParams();
            Object.entries(filters).forEach(([k, v]) => { if (v) qs.set(k, v); });
            if (currentPage > 1) qs.set('page', currentPage);
            const s = qs.toString();
            history.replaceState(null, '', location.pathname + (s ? `?${s}` : ''));
        }

        function restoreFromUrl() {
            const qs = new URLSearchParams(location.search);
            els.search.value = qs.get('search') || '';
            const setSelect = (el, v) => { if (v && [...el.options].some(o => o.value === v)) el.value = v; };
            setSelect(els.status, qs.get('status'));
            setSelect(els.priority, qs.get('priority'));
            setSelect(els.province, qs.get('province'));
            currentPage = Math.max(1, parseInt(qs.get('page'), 10) || 1);
        }

        function rowHtml(c) {
            const place = [App.textOr(c.Last_Seen_place, ''), App.textOr(c.Last_Seen_district, ''), App.textOr(c.Last_Seen_province, '')]
                .filter(Boolean).join(' ') || 'ไม่ระบุสถานที่';
            const age = App.textOr(c.missingperson_age, '');
            const gender = App.textOr(c.missingperson_gender, '');
            const meta = [gender && `เพศ ${gender}`, age !== '' && `อายุ ${age} ปี`].filter(Boolean).join(' • ');
            return `
            <tr>
                <td><img src="${App.escapeHtml(App.imageUrl(c.character_image_url))}" ${App.imgFallbackAttr()} class="person-img" alt="ภาพบุคคลสูญหาย"></td>
                <td>
                    <div class="fw-bold">${App.escapeHtml(App.fullName(c.missingperson_title, c.missingperson_name))}</div>
                    <div class="small text-body-secondary"><i class="fa-solid fa-hashtag"></i> รหัสเคส ${App.escapeHtml(c.case_id)}${meta ? ` • ${App.escapeHtml(meta)}` : ''}</div>
                </td>
                <td>
                    <div><i class="fa-solid fa-location-dot text-danger"></i> ${App.escapeHtml(place)}</div>
                    <div class="small text-body-secondary">หายเมื่อ ${App.escapeHtml(App.formatThaiDate(c.Last_Seen_date))} • รับแจ้ง ${App.escapeHtml(App.formatThaiDate(c.case_received_date))}</div>
                </td>
                <td>
                    ${App.priorityBadge(c.case_priority, 'mb-1')}<br>
                    ${App.statusBadge(c.case_latest_status)}
                </td>
                <td class="text-center">
                    <a href="case-detail.html?id=${encodeURIComponent(c.case_id)}" class="btn btn-outline-primary btn-sm fw-bold">ดูรายละเอียด</a>
                </td>
            </tr>`;
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) { els.pagination.innerHTML = ''; return; }
            const item = (label, page, { disabled = false, active = false } = {}) =>
                `<li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}">
                    <a class="page-link" href="#" data-page="${page}" ${active ? 'aria-current="page"' : ''}>${label}</a></li>`;
            let html = item('ก่อนหน้า', currentPage - 1, { disabled: currentPage === 1 });
            const pages = new Set([1, totalPages, currentPage - 1, currentPage, currentPage + 1]);
            let last = 0;
            [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b).forEach(p => {
                if (p - last > 1) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
                html += item(p, p, { active: p === currentPage });
                last = p;
            });
            html += item('ถัดไป', currentPage + 1, { disabled: currentPage === totalPages });
            els.pagination.innerHTML = html;
        }

        function renderPage() {
            const total = allCases.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            currentPage = Math.min(Math.max(1, currentPage), totalPages);
            if (total === 0) {
                const f = currentFilters();
                const filtered = Object.values(f).some(Boolean);
                App.renderState(els.body, 'empty', filtered ? 'ไม่พบเคสที่ตรงกับเงื่อนไขการค้นหา' : 'ยังไม่มีเคสในระบบ', { colspan: COLS });
                els.summary.textContent = 'พบ 0 รายการ';
                renderPagination(0);
                return;
            }
            const startIdx = (currentPage - 1) * PAGE_SIZE;
            const pageItems = allCases.slice(startIdx, startIdx + PAGE_SIZE);
            els.body.innerHTML = pageItems.map(rowHtml).join('');
            els.summary.textContent = `พบ ${total.toLocaleString('th-TH')} รายการ • แสดง ${startIdx + 1}-${startIdx + pageItems.length}`;
            renderPagination(totalPages);
        }

        async function loadCases(keepPage) {
            const seq = ++requestSeq;
            const filters = currentFilters();
            if (!keepPage) currentPage = 1;
            syncUrl(filters);
            App.renderState(els.body, 'loading', 'กำลังโหลดรายการเคส...', { colspan: COLS });
            els.summary.textContent = '';
            els.pagination.innerHTML = '';
            try {
                const data = await App.api('/cases', { query: filters });
                if (seq !== requestSeq) return; // มีคำค้นใหม่กว่าแล้ว
                allCases = Array.isArray(data) ? data : [];
                renderPage();
                syncUrl(filters);
            } catch (err) {
                if (seq !== requestSeq) return;
                console.error('GET /api/cases ล้มเหลว:', err);
                allCases = [];
                App.renderState(els.body, 'error', `โหลดรายการเคสไม่สำเร็จ: ${err.message}`, { colspan: COLS, onRetry: () => loadCases(true) });
            }
        }

        els.form.addEventListener('submit', (e) => { e.preventDefault(); loadCases(); });
        els.search.addEventListener('input', App.debounce(() => loadCases(), 450));
        [els.status, els.priority, els.province].forEach(el => el.addEventListener('change', () => loadCases()));
        document.getElementById('resetBtn').addEventListener('click', () => {
            els.form.reset();
            loadCases();
        });
        els.pagination.addEventListener('click', (e) => {
            const a = e.target.closest('a[data-page]');
            if (!a) return;
            e.preventDefault();
            if (a.parentElement.classList.contains('disabled')) return;
            currentPage = parseInt(a.dataset.page, 10);
            renderPage();
            syncUrl(currentFilters());
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        restoreFromUrl();
        loadCases(true);
    </script>
</body>
