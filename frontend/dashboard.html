<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปภาพรวม</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { background:#f4f6f9; }
.main-container { margin-top:30px; }
.card-box { background:#fff; border-radius:16px; padding:22px; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
.summary-title { font-size:14px; color:#6c757d; }
.summary-value { font-size:28px; font-weight:700; }
</style>
</head>
<body>
<script src="app.js"></script>
<script>guardAdmin('');</script>
<div id="appNavbar"></div>
<div class="container main-container">
  <div class="row g-3 mb-4" id="summary"></div>
  <div class="row g-3 mb-4">
    <div class="col-md-6"><div class="card-box"><canvas id="pie"></canvas></div></div>
    <div class="col-md-6"><div class="card-box"><canvas id="bar"></canvas></div></div>
  </div>
  <div class="card-box">
    <table class="table table-hover">
      <thead><tr><th>ชื่อ</th><th>สถานะ</th><th>เบาะแส</th></tr></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</div>
<script>
  renderNavbar({ mountId: 'appNavbar', basePath: '', active: 'dashboard' });
  let pieChart, barChart;
  async function loadData() {
    const cases = await fetchCaseList();
    const tips = getStoredTips();
    render(cases, tips);
  }
  function render(cases, tips) {
    const found = cases.filter(c => normalizeStatus(c.latest_status).includes('พบตัวบุคคลแล้ว')).length;
    const waiting = cases.filter(c => normalizeStatus(c.latest_status) === 'รับเคส(บันทึกข้อมูลในระบบ)').length;
    const progress = cases.length - found - waiting;
    document.getElementById('summary').innerHTML = `
      <div class="col-md-4"><div class="card-box text-center"><div class="summary-title">ทั้งหมด</div><div class="summary-value">${cases.length}</div></div></div>
      <div class="col-md-4"><div class="card-box text-center text-warning"><div class="summary-title">รับเคสใหม่</div><div class="summary-value">${waiting}</div></div></div>
      <div class="col-md-4"><div class="card-box text-center text-success"><div class="summary-title">พบตัวแล้ว</div><div class="summary-value">${found}</div></div></div>`;
    document.getElementById('table').innerHTML = cases.map(c => {
      const caseId = getCaseId(c);
      const tipCount = tips.filter(t => String(t.caseId) === String(caseId)).length;
      return `<tr><td>${c.missing_name || c.name || '-'}</td><td>${normalizeStatus(c.latest_status)}</td><td>${tipCount}</td></tr>`;
    }).join('');
    const pieCtx = document.getElementById('pie');
    const barCtx = document.getElementById('bar');
    pieChart?.destroy(); barChart?.destroy();
    pieChart = new Chart(pieCtx, { type:'doughnut', data:{ labels:['รับเคสใหม่','กำลังดำเนินการ','พบตัวแล้ว'], datasets:[{ data:[waiting, progress, found], backgroundColor:['#ffc107','#0dcaf0','#198754'] }] } });
    barChart = new Chart(barCtx, { type:'bar', data:{ labels:['เคสทั้งหมด','เบาะแสทั้งหมด'], datasets:[{ label:'จำนวน', data:[cases.length, tips.length], backgroundColor:['#0b2c4d','#4f83b6'] }] }, options:{ scales:{ y:{ beginAtZero:true } } } });
  }
  loadData();
</script>
</body>
</html>
