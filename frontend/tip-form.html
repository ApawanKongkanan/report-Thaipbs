<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเบาะแส</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f4f6f9;
    }

    .page-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .case-info-box,
    .search-box,
    .result-box {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 18px;
    }

    .section-title {
      color: #0b2c4d;
      font-weight: 700;
    }

    .case-select-card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: 0.2s ease;
    }

    .case-select-card:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    .selected-case {
      border: 2px solid #0d6efd;
      background: #eef5ff;
    }
  </style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0b2c4d;">
    <div class="container-fluid">
  
      <!-- LOGO -->
      <a class="navbar-brand d-flex align-items-center gap-2"
         href="Homepage.html">
        <img src="LOGO ThaiPBS.png" height="40">
        <span class="fw-bold">ศูนย์ข้อมูลคนหาย</span>
      </a>
  
      <!-- TOGGLE BUTTON -->
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
  
      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-end" id="mainMenu">
        <ul class="navbar-nav align-items-lg-center gap-2">
  
          <li class="nav-item">
            <a class="nav-link" href="Homepage.html">หน้าหลัก</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="report-missing-step/report-missing-step.html">แจ้งคนหาย</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link active" href="tip-form.html">แจ้งเบาะแส</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" href="track-case.html">ติดตามเคส</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="admin.html">สำหรับเจ้าหน้าที่</a>
          </li>
  
          <li class="nav-item ms-lg-3">
            <button class="btn btn-outline-light rounded-pill">
              <i class="fa-solid fa-user"></i> เข้าสู่ระบบ
            </button>
          </li>
  
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card page-card p-4">
      <h2 class="section-title mb-3">แจ้งเบาะแส</h2>
      <p class="text-muted mb-4">
        กรุณากรอกข้อมูลเบาะแสให้ครบถ้วน เพื่อช่วยติดตามเคสคนหายได้อย่างรวดเร็วมากขึ้น
      </p>

      <!-- ส่วนค้นหาเคส -->
      <div id="caseSearchSection" class="search-box mb-4" style="display:none;">
        <h5 class="mb-3">1. เลือกเคสที่ต้องการแจ้งเบาะแส</h5>

        <div class="row g-3 align-items-end">
          <div class="col-md-9">
            <label class="form-label">ค้นหาชื่อผู้สูญหาย</label>
            <input
              type="text"
              id="caseSearchInput"
              class="form-control"
              placeholder="พิมพ์ชื่อผู้สูญหาย"
            >
          </div>
          <div class="col-md-3 d-grid">
            <button type="button" class="btn btn-primary" id="caseSearchBtn">
              <i class="fa-solid fa-magnifying-glass"></i> ค้นหาเคส
            </button>
          </div>
        </div>

        <div id="caseSearchResult" class="result-box mt-3" style="display:none;"></div>
      </div>

      <!-- ข้อมูลเคสที่เลือก -->
      <div id="caseInfo" class="case-info-box mb-4">
        กำลังโหลดข้อมูลเคส...
      </div>

      <form id="tipForm">
        <input type="hidden" id="case_id" name="case_id">

        <div class="mb-3">
          <label class="form-label">ชื่อผู้ให้เบาะแส</label>
          <input type="text" class="form-control" id="tipster_name" name="tipster_name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">เบอร์โทรติดต่อ</label>
          <input
            type="tel"
            class="form-control"
            id="tipster_phone"
            name="tipster_phone"
            placeholder="เช่น 0812345678"
            pattern="^[0-9]{10}$"
            maxlength="10"
            inputmode="numeric"
            required
          >
          <div class="invalid-feedback">
            กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">สถานที่ที่พบเห็น / เบาะแส</label>
          <input type="text" class="form-control" id="tip_location" name="tip_location" required>
        </div>

        <div class="mb-3">
          <label class="form-label">วันที่พบเห็น</label>
          <input type="date" class="form-control" id="tip_date" name="tip_date" required>
        </div>

        <div class="mb-3">
          <label class="form-label">เวลาที่พบเห็น</label>
          <input type="time" class="form-control" id="tip_time" name="tip_time">
        </div>

        <div class="mb-3">
          <label class="form-label">รายละเอียดเบาะแส</label>
          <textarea
            class="form-control"
            id="tip_detail"
            name="tip_detail"
            rows="5"
            placeholder="อธิบายรายละเอียดสิ่งที่พบเห็น"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">แนบรูปภาพเพิ่มเติม (ถ้ามี)</label>
          <input type="file" class="form-control" id="tip_image" name="tip_image" accept="image/*">
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i> ส่งเบาะแส
          </button>
          <button type="button" class="btn btn-outline-secondary" onclick="goBackToTrack()">
            <i class="fa-solid fa-arrow-left"></i> กลับไปหน้าติดตามเคส
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CASE_API = "http://localhost:3000/api/missing-persons";
    const TIP_API = "http://localhost:3000/api/reports";

    const params = new URLSearchParams(window.location.search);
    let caseId = params.get("case_id") || "";

    function goBackToTrack() {
      if (caseId) {
        window.location.href = `track-case.html?case_id=${caseId}`;
      } else {
        window.location.href = "track-case.html";
      }
    }

    function renderCaseInfo(item) {
      const caseInfo = document.getElementById("caseInfo");
      caseInfo.innerHTML = `
        <div class="row g-3">
          <div class="col-md-6">
            <div><strong>เลขเคส:</strong> ${item.case_id || "-"}</div>
            <div><strong>ชื่อผู้สูญหาย:</strong> ${item.missing_name || "-"}</div>
            <div><strong>เพศ:</strong> ${item.gender || "-"}</div>
          </div>
          <div class="col-md-6">
            <div><strong>อายุ:</strong> ${item.age || "-"}</div>
            <div><strong>เหตุผล/หัวข้อ:</strong> ${item.missing_reason || "-"}</div>
            <div><strong>สถานะล่าสุด:</strong> ${item.latest_status || "-"}</div>
          </div>
        </div>
      `;
    }

    async function loadCaseInfoById(selectedCaseId) {
      const caseInfo = document.getElementById("caseInfo");

      if (!selectedCaseId) {
        caseInfo.innerHTML = `
          <div class="text-danger">
            กรุณาเลือกเคสก่อนแจ้งเบาะแส
          </div>
        `;
        return;
      }

      document.getElementById("case_id").value = selectedCaseId;

      try {
        const res = await fetch(`${CASE_API}/${selectedCaseId}`);
        const result = await res.json();
        const item = result.data || result;

        if (!item || (!item.case_id && !item.missing_name)) {
          throw new Error("ไม่พบข้อมูลเคส");
        }

        renderCaseInfo(item);
      } catch (error) {
        console.error("LOAD CASE INFO ERROR:", error);
        caseInfo.innerHTML = `
          <div class="text-danger">
            ไม่สามารถโหลดข้อมูลเคสได้
          </div>
        `;
      }
    }

    async function searchCasesByName() {
      const keyword = document.getElementById("caseSearchInput").value.trim().toLowerCase();
      const resultBox = document.getElementById("caseSearchResult");

      if (!keyword) {
        resultBox.style.display = "block";
        resultBox.innerHTML = `<div class="text-danger">กรุณาพิมพ์ชื่อผู้สูญหายก่อนค้นหา</div>`;
        return;
      }

      resultBox.style.display = "block";
      resultBox.innerHTML = `<div class="text-muted">กำลังค้นหาข้อมูลเคส...</div>`;

      try {
        const res = await fetch(CASE_API);
        const result = await res.json();
        const rows = Array.isArray(result) ? result : (result.data || []);

        const filtered = rows.filter(item =>
          (item.missing_name || "").toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
          resultBox.innerHTML = `<div class="text-muted">ไม่พบเคสที่ตรงกับชื่อที่ค้นหา</div>`;
          return;
        }

        resultBox.innerHTML = filtered.map(item => `
          <div class="case-select-card ${String(caseId) === String(item.case_id) ? "selected-case" : ""}">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
              <div>
                <div><strong>เลขเคส:</strong> ${item.case_id || "-"}</div>
                <div><strong>ชื่อผู้สูญหาย:</strong> ${item.missing_name || "-"}</div>
                <div><strong>หัวข้อ:</strong> ${item.missing_reason || "-"}</div>
                <div><strong>สถานะ:</strong> ${item.latest_status || "-"}</div>
              </div>
              <div>
                <button type="button" class="btn btn-sm btn-primary" onclick="selectCase(${item.case_id})">
                  เลือกเคสนี้
                </button>
              </div>
            </div>
          </div>
        `).join("");
      } catch (error) {
        console.error("SEARCH CASE ERROR:", error);
        resultBox.innerHTML = `<div class="text-danger">ไม่สามารถค้นหาข้อมูลเคสได้</div>`;
      }
    }

    function selectCase(selectedCaseId) {
      caseId = String(selectedCaseId);
      document.getElementById("case_id").value = caseId;
      loadCaseInfoById(caseId);

      const url = new URL(window.location.href);
      url.searchParams.set("case_id", caseId);
      window.history.replaceState({}, "", url);

      const resultBox = document.getElementById("caseSearchResult");
      const cards = resultBox.querySelectorAll(".case-select-card");
      cards.forEach(card => card.classList.remove("selected-case"));

      const selectedButton = Array.from(resultBox.querySelectorAll("button")).find(
        btn => btn.getAttribute("onclick") === `selectCase(${selectedCaseId})`
      );

      if (selectedButton) {
        const card = selectedButton.closest(".case-select-card");
        if (card) card.classList.add("selected-case");
      }
    }

    document.getElementById("tipForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      if (!caseId) {
        alert("กรุณาเลือกเคสก่อนแจ้งเบาะแส");
        return;
      }

      const phoneInput = document.getElementById("tipster_phone");
      const phoneRegex = /^[0-9]{10}$/;

      if (!phoneRegex.test(phoneInput.value.trim())) {
        phoneInput.classList.add("is-invalid");
        phoneInput.reportValidity();
        return;
      } else {
        phoneInput.classList.remove("is-invalid");
      }

      const form = document.getElementById("tipForm");
      const formData = new FormData(form);
      formData.set("case_id", caseId);

      try {
        const res = await fetch(TIP_API, {
          method: "POST",
          body: formData
        });

        const result = await res.json();

        if (res.ok) {
          alert("✅ ส่งเบาะแสเรียบร้อย");
          goBackToTrack();
        } else {
          alert("❌ เกิดข้อผิดพลาดในการส่งเบาะแส");
          console.log(result);
        }
      } catch (error) {
        console.error("SUBMIT TIP ERROR:", error);
        alert("❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
      }
    });

    document.getElementById("caseSearchBtn").addEventListener("click", searchCasesByName);
    document.getElementById("caseSearchInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        searchCasesByName();
      }
    });

    function initPage() {
      const caseSearchSection = document.getElementById("caseSearchSection");

      if (caseId) {
        caseSearchSection.style.display = "none";
        loadCaseInfoById(caseId);
      } else {
        caseSearchSection.style.display = "block";
        document.getElementById("caseInfo").innerHTML = `
          <div class="text-muted">
            กรุณาค้นหาและเลือกเคสที่ต้องการแจ้งเบาะแสก่อนกรอกข้อมูล
          </div>
        `;
      }
    }

    initPage();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
