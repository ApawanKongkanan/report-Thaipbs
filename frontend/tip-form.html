<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเบาะแส</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f4f6f9; }
    .page-card { border:none; border-radius:18px; box-shadow:0 8px 20px rgba(0,0,0,.08); }
    .case-info-box,.search-box,.result-box { background:#f8f9fa; border-radius:14px; padding:18px; }
    .section-title { color:#0b2c4d; font-weight:700; }
    .case-select-card { background:#fff; border:1px solid #dee2e6; border-radius:14px; padding:16px; margin-bottom:12px; }
    .case-select-card.selected-case { border:2px solid #0d6efd; background:#eef5ff; }
  </style>
</head>
<body>
<div id="appNavbar"></div>
<div class="container my-5">
  <div class="card page-card p-4">
    <h2 class="section-title mb-3">แจ้งเบาะแส</h2>
    <p class="text-muted mb-4">กรุณาเลือกเคสและกรอกข้อมูลเบาะแสให้ครบถ้วน</p>

    <div id="caseSearchSection" class="search-box mb-4">
      <h5 class="mb-3">1. เลือกเคสที่ต้องการแจ้งเบาะแส</h5>
      <div class="row g-3 align-items-end">
        <div class="col-md-9">
          <label class="form-label">ค้นหาชื่อผู้สูญหาย</label>
          <input type="text" id="caseSearchInput" class="form-control" placeholder="พิมพ์ชื่อผู้สูญหาย">
        </div>
        <div class="col-md-3 d-grid">
          <button type="button" class="btn btn-primary" id="caseSearchBtn"><i class="fa-solid fa-magnifying-glass"></i> ค้นหาเคส</button>
        </div>
      </div>
      <div id="caseSearchResult" class="result-box mt-3" style="display:none;"></div>
    </div>

    <div id="caseInfo" class="case-info-box mb-4">กรุณาเลือกเคสก่อนแจ้งเบาะแส</div>

    <form id="tipForm">
      <input type="hidden" id="case_id" name="case_id">
      <div class="mb-3"><label class="form-label">ชื่อผู้ให้เบาะแส</label><input type="text" class="form-control" id="tipster_name" name="tipster_name" required></div>
      <div class="mb-3"><label class="form-label">เบอร์โทรติดต่อ</label><input type="tel" class="form-control" id="tipster_phone" name="tipster_phone" maxlength="10" placeholder="เช่น 0812345678" required></div>
      <div class="mb-3"><label class="form-label">สถานที่ที่พบเห็น / เบาะแส</label><input type="text" class="form-control" id="tip_location" name="tip_location" required></div>
      <div class="mb-3"><label class="form-label">วันที่พบเห็น</label><input type="date" class="form-control" id="tip_date" name="tip_date" required></div>
      <div class="mb-3"><label class="form-label">เวลาที่พบเห็น</label><input type="time" class="form-control" id="tip_time" name="tip_time"></div>
      <div class="mb-3"><label class="form-label">รายละเอียดเบาะแส</label><textarea class="form-control" id="tip_detail" name="tip_detail" rows="5" required></textarea></div>
      <div class="mb-4"><label class="form-label">แนบรูปภาพเพิ่มเติม (ถ้ามี)</label><input type="file" class="form-control" id="tip_image" name="tip_image" accept="image/*"></div>
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> ส่งเบาะแส</button>
        <button type="button" class="btn btn-outline-secondary" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> กลับ</button>
      </div>
    </form>
  </div>
</div>
<script src="app.js"></script>
<script>
  renderNavbar({ mountId: 'appNavbar', basePath: '', active: 'tip' });

  const CASE_API = APP_API;
  const params = new URLSearchParams(window.location.search);
  let caseId = params.get('case_id') || '';

  function goBack() {
    if (isAdminLogin() && caseId) {
      window.location.href = `admin-case-detail.html?id=${caseId}`;
      return;
    }
    window.location.href = caseId ? `track-case.html?case_id=${caseId}` : 'track-case.html';
  }

  function renderCaseInfo(item) {
    document.getElementById('caseInfo').innerHTML = `
      <div class="row g-3">
        <div class="col-md-6"><div><strong>เลขเคส:</strong> ${getCaseId(item)}</div><div><strong>ชื่อ:</strong> ${item.missing_name || item.name || '-'}</div></div>
        <div class="col-md-6"><div><strong>อายุ:</strong> ${item.age || '-'}</div><div><strong>หัวข้อ:</strong> ${item.missing_reason || item.reason || '-'}</div></div>
      </div>`;
  }

  async function loadCaseInfoById(id) {
    const item = await fetchCaseById(id);
    if (!item) {
      document.getElementById('caseInfo').innerHTML = '<span class="text-danger">ไม่สามารถโหลดข้อมูลเคสได้</span>';
      return;
    }
    caseId = String(getCaseId(item));
    document.getElementById('case_id').value = caseId;
    renderCaseInfo(item);
  }

  async function searchCasesByName() {
    const keyword = document.getElementById('caseSearchInput').value.trim().toLowerCase();
    const resultBox = document.getElementById('caseSearchResult');
    const rows = await fetchCaseList();
    const filtered = rows.filter(item => (item.missing_name || item.name || '').toLowerCase().includes(keyword));
    resultBox.style.display = 'block';
    if (filtered.length === 0) {
      resultBox.innerHTML = 'ไม่พบข้อมูลเคส';
      return;
    }
    resultBox.innerHTML = filtered.map(item => `
      <div class="case-select-card">
        <div><strong>${item.missing_name || item.name || '-'}</strong><br>${item.missing_reason || item.reason || '-'}</div>
        <button class="btn btn-sm btn-primary mt-2" onclick="selectCase('${getCaseId(item)}')">เลือก</button>
      </div>`).join('');
  }

  async function selectCase(id) {
    await loadCaseInfoById(id);
    document.querySelectorAll('.case-select-card').forEach(el => el.classList.remove('selected-case'));
    [...document.querySelectorAll('.case-select-card button')].find(btn => btn.getAttribute('onclick')?.includes(`'${id}'`))?.closest('.case-select-card')?.classList.add('selected-case');
  }

  document.getElementById('tipForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!caseId) {
      alert('กรุณาเลือกเคสก่อน');
      return;
    }
    const phone = document.getElementById('tipster_phone').value.trim();
    if (!/^[0-9]{10}$/.test(phone)) {
      alert('กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก');
      return;
    }

    const formData = new FormData(this);
    const tips = getStoredTips();
    tips.push({
      id: Date.now(),
      caseId,
      tipster_name: formData.get('tipster_name'),
      tipster_phone: phone,
      tip_location: formData.get('tip_location'),
      tip_date: formData.get('tip_date'),
      tip_time: formData.get('tip_time'),
      tip_detail: formData.get('tip_detail'),
      created_at: new Date().toISOString()
    });
    saveStoredTips(tips);

    const cases = getStoredCases();
    const idx = cases.findIndex(item => String(getCaseId(item)) === String(caseId));
    if (idx >= 0) {
      cases[idx].latest_status = 'ได้รับแจ้งเบาะแสใหม่';
      saveStoredCases(cases);
    }

    try {
      await fetch('http://localhost:3000/api/reports', { method: 'POST', body: formData });
    } catch (error) {
      console.warn('API แจ้งเบาะแสใช้งานไม่ได้ ใช้ localStorage แทน');
    }

    alert('✅ ส่งเบาะแสเรียบร้อย');
    window.location.href = `admin-case-detail.html?id=${caseId}`;
  });

  document.getElementById('caseSearchBtn').addEventListener('click', searchCasesByName);
  document.getElementById('caseSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      searchCasesByName();
    }
  });

  if (caseId) loadCaseInfoById(caseId);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
