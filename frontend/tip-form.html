<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเบาะแส</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
  background: #f4f6f9;
  opacity: 0;
  transition: opacity 0.4s ease;
}

body.loaded {
  opacity: 1;
}

    .page-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .case-info-box,
    .search-box,
    .result-box {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 18px;
    }
    .case-info-box {
  transition: opacity 0.3s ease, transform 0.3s ease;
}

    .section-title {
      color: #0b2c4d;
      font-weight: 700;
    }

    .case-select-card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: 0.2s ease;
    }

    .case-select-card:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    .selected-case {
      border: 2px solid #0d6efd;
      background: #eef5ff;
    }
  </style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0b2c4d;">
    <div class="container-fluid">
  
      <!-- LOGO -->
      <a class="navbar-brand d-flex align-items-center gap-2"
         href="Homepage.html">
        <img src="LOGO ThaiPBS.png" height="40">
        <span class="fw-bold">ศูนย์ข้อมูลคนหาย</span>
      </a>
  
      <!-- TOGGLE BUTTON -->
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
  
      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-end" id="mainMenu">
        <ul class="navbar-nav align-items-lg-center gap-2">
  
          <li class="nav-item">
            <a class="nav-link" href="Homepage.html">หน้าหลัก</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="report-missing-step/report-missing-step.html">แจ้งคนหาย</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link active" href="tip-form.html">แจ้งเบาะแส</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" href="track-case.html">ติดตามเคส</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="admin.html">สำหรับเจ้าหน้าที่</a>
          </li>
  
          <li class="nav-item" id="dashboardMenu"></li>
<li class="nav-item ms-lg-3" id="authBtn"></li>
  
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card page-card p-4">
      <h2 class="section-title mb-3">แจ้งเบาะแส</h2>
      <p class="text-muted mb-4">
        กรุณากรอกข้อมูลเบาะแสให้ครบถ้วน เพื่อช่วยติดตามเคสคนหายได้อย่างรวดเร็วมากขึ้น
      </p>

      <!-- ส่วนค้นหาเคส -->
      <div id="caseSearchSection" class="search-box mb-4">
        <h5 class="mb-3">1. เลือกเคสที่ต้องการแจ้งเบาะแส</h5>

        <div class="row g-3 align-items-end">
          <div class="col-md-9">
            <label class="form-label">ค้นหาชื่อผู้สูญหาย</label>
            <input
              type="text"
              id="caseSearchInput"
              class="form-control"
              placeholder="พิมพ์ชื่อผู้สูญหาย"
            >
          </div>
          <div class="col-md-3 d-grid">
            <button type="button" class="btn btn-primary" id="caseSearchBtn">
              <i class="fa-solid fa-magnifying-glass"></i> ค้นหาเคส
            </button>
          </div>
        </div>

        <div id="caseSearchResult" class="result-box mt-3" style="display:none;"></div>
      </div>

      <!-- ข้อมูลเคสที่เลือก -->
      <div id="caseInfo" class="case-info-box mb-4" style="opacity:0.5;">
      </div>

      <form id="tipForm">
        <input type="hidden" id="case_id" name="case_id">

        <div class="mb-3">
          <label class="form-label">ชื่อผู้ให้เบาะแส</label>
          <input type="text" class="form-control" id="tipster_name" name="reporter_name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">เบอร์โทรติดต่อ</label>
          <input
            type="tel"
            class="form-control"
            id="tipster_phone"
            name="reporter_phone"
            placeholder="เช่น 0812345678"
            pattern="^[0-9]{10}$"
            maxlength="10"
            inputmode="numeric"
            required
          >
          <div class="invalid-feedback">
            กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">สถานที่ที่พบเห็น / เบาะแส</label>
          <input type="text" class="form-control" id="tip_location" name="tip_location" required>
        </div>

        <div class="mb-3">
          <label class="form-label">วันที่พบเห็น</label>
          <input type="date" class="form-control" id="tip_date" name="tip_date" required>
        </div>

        <div class="mb-3">
          <label class="form-label">เวลาที่พบเห็น</label>
          <input type="time" class="form-control" id="tip_time" name="tip_time">
        </div>

        <div class="mb-3">
          <label class="form-label">รายละเอียดเบาะแส</label>
          <textarea
            class="form-control"
            id="tip_detail"
            name="tip_detail"
            rows="5"
            placeholder="อธิบายรายละเอียดสิ่งที่พบเห็น"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">แนบรูปภาพเพิ่มเติม (ถ้ามี)</label>
          <input type="file" class="form-control" id="tip_image" name="tip_image" accept="image/*">
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i> ส่งเบาะแส
          </button>
          <button type="button" class="btn btn-outline-secondary" onclick="goBackToTrack()">
            <i class="fa-solid fa-arrow-left"></i> กลับไปหน้าติดตามเคส
          </button>
        </div>
      </form>
    </div>
  </div>

<!-- (ตัด head + css เหมือนของคุณ ใช้ของเดิมได้) -->

<script>
  const CASE_API = "http://localhost:3000/api/missing-persons";
  const TIP_API = "http://localhost:3000/api/reports";
  
  const params = new URLSearchParams(window.location.search);
  let caseId = params.get("case_id") || "";
  
  /* =========================
     NAVIGATION
  ========================= */
  function goBackToTrack() {
    if (caseId) {
      window.location.href = `track-case.html?case_id=${caseId}`;
    } else {
      window.location.href = "track-case.html";
    }
  }
  
  /* =========================
     RENDER CASE INFO
  ========================= */
  function renderCaseInfo(item) {
    const caseInfo = document.getElementById("caseInfo");
  
    caseInfo.innerHTML = `
      <div class="row g-3">
        <div class="col-md-6">
          <div><strong>เลขเคส:</strong> ${item.case_id || item.id}</div>
          <div><strong>ชื่อ:</strong> ${item.missing_name || item.name}</div>
        </div>
        <div class="col-md-6">
          <div><strong>อายุ:</strong> ${item.age || "-"}</div>
          <div><strong>หัวข้อ:</strong> ${item.missing_reason || item.reason}</div>
        </div>
      </div>
    `;
  }
  
  /* =========================
     LOAD CASE
  ========================= */
  async function loadCaseInfoById(selectedCaseId) {
    document.getElementById("case_id").value = selectedCaseId;
  
    try {
      const res = await fetch(`${CASE_API}/${selectedCaseId}`);
      const result = await res.json();
      const item = result.data || result;
  
      renderCaseInfo(item);

const el = document.getElementById("caseInfo");
el.style.opacity = "1";
el.style.transform = "translateY(0)";
  
    } catch {
      // fallback local
      const cases = JSON.parse(localStorage.getItem("cases")) || [];
      const item = cases.find(c => String(c.id) === String(selectedCaseId));
  
      if (item) {
  renderCaseInfo(item);

  const el = document.getElementById("caseInfo");
  el.style.opacity = "1";
  el.style.transform = "translateY(0)";
}
      else document.getElementById("caseInfo").innerHTML = "ไม่พบข้อมูล";
    }
  }
  
  /* =========================
     SEARCH CASE
  ========================= */
  async function searchCasesByName() {
    const keyword = document.getElementById("caseSearchInput").value.toLowerCase();
    const resultBox = document.getElementById("caseSearchResult");

    resultBox.style.display = "block";
    resultBox.innerHTML = "กำลังค้นหา...";

    if (!keyword.trim()) {
  resultBox.innerHTML = "กรุณาพิมพ์ชื่อก่อนค้นหา";
  resultBox.style.display = "block";
  return;
}
  
    let rows = [];
  
    try {
      const res = await fetch(CASE_API);
      const result = await res.json();
      rows = Array.isArray(result) ? result : (result.data || []);
    } catch {
      rows = JSON.parse(localStorage.getItem("cases")) || [];
    }
  
    const filtered = rows.filter(item =>
      (item.missing_name || item.name || "").toLowerCase().includes(keyword)
    );
  
    if (filtered.length === 0) {
      resultBox.innerHTML = "ไม่พบเคส";
      resultBox.style.display = "block";
      return;
    }
  
    resultBox.style.display = "block";
    resultBox.innerHTML = filtered.map(item => `
      <div class="case-select-card">
        <div>
          <strong>${item.missing_name || item.name}</strong><br>
          ${item.missing_reason || item.reason}
        </div>
        <button class="btn btn-sm btn-primary mt-2"
          onclick="selectCase(${item.case_id || item.id})">
          เลือก
        </button>
      </div>
    `).join("");
  }
  
  function selectCase(id) {

caseId = id;

const info = document.getElementById("caseInfo");

// ✅ เพิ่มตรงนี้

info.style.opacity = "0.3";

info.style.transform = "translateY(5px)";

setTimeout(() => {

  loadCaseInfoById(id);

}, 200);

  const url = new URL(window.location.href);
  url.searchParams.set("case_id", id);
  window.history.replaceState({}, "", url);

  // 🔥 highlight card
  document.querySelectorAll(".case-select-card")
    .forEach(el => el.classList.remove("selected-case"));

  const btn = [...document.querySelectorAll("button")]
  .find(b => b.getAttribute("onclick")?.includes(`selectCase(${id})`));

  if (btn) {
    btn.closest(".case-select-card")?.classList.add("selected-case");
  }

  document.getElementById("caseInfo").scrollIntoView({ behavior: "smooth" });
}
  
  /* =========================
     SUBMIT TIP (สำคัญสุด🔥)
  ========================= */
  document.getElementById("tipForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const submitBtn = this.querySelector("button[type='submit']");
  submitBtn.disabled = true;

  if (!caseId) {
    alert("กรุณาเลือกเคสก่อน");
    submitBtn.disabled = false;
    return;
  }

  const phone = document.getElementById("tipster_phone").value;
  if (!/^[0-9]{10}$/.test(phone)) {
    alert("เบอร์ไม่ถูกต้อง");
    submitBtn.disabled = false;
    return;
  }

  const form = new FormData(this);

  // ✅ save local
  let tips = JSON.parse(localStorage.getItem("tips")) || [];

  const newTip = {
    id: Date.now(),
    caseId: caseId,
    name: form.get("tipster_name"),
    phone: form.get("tipster_phone"),
    location: form.get("tip_location"),
    date: form.get("tip_date"),
    time: form.get("tip_time"),
    detail: form.get("tip_detail"),
    createdAt: Date.now()
  };

  tips.push(newTip);
  localStorage.setItem("tips", JSON.stringify(tips));

  // ✅ ยิง API (optional)
  try {
    await fetch(TIP_API, {
      method: "POST",
      body: form
    });
  } catch {
    console.warn("API ใช้ไม่ได้ ใช้ local แทน");
  }

  // ✅ success
  alert("✅ ส่งเบาะแสเรียบร้อย");
  this.reset();
  submitBtn.disabled = false;
  goBackToTrack();
});
  
  /* =========================
     EVENTS
  ========================= */
  document.getElementById("caseSearchBtn").addEventListener("click", searchCasesByName);
  document.getElementById("caseSearchInput").addEventListener("keydown", function(e){

if(e.key === "Enter"){

  e.preventDefault();

  searchCasesByName();

}

});
  
  /* =========================
     INIT
  ========================= */
  function initPage() {
    if (caseId) {
  loadCaseInfoById(caseId);
} else {
  const el = document.getElementById("caseInfo");
  el.innerHTML = "กรุณาเลือกเคสก่อนแจ้งเบาะแส";
  el.style.opacity = "1"; // ✅ เพิ่มบรรทัดนี้
}
  }
  
  initPage();

  window.addEventListener("load", () => {
  document.body.classList.add("loaded");
});
/* =========================
   AUTH NAVBAR
========================= */
function renderAuthButton() {
  const isAdmin = localStorage.getItem("isAdminLogin");
  const el = document.getElementById("authBtn");

  if (isAdmin === "true") {
    el.innerHTML = `
      <button class="btn btn-outline-danger" onclick="logoutAdmin()">
        ออกจากระบบ
      </button>
    `;
  } else {
    el.innerHTML = `
      <button class="btn btn-outline-light rounded-pill"
        onclick="window.location.href='login.html'">
        <i class="fa-solid fa-user"></i> เข้าสู่ระบบ
      </button>
    `;
  }
}

/* =========================
   ADMIN MENU
========================= */
function renderAdminMenu() {
  const isAdmin = localStorage.getItem("isAdminLogin");

  if (isAdmin === "true") {
    document.getElementById("dashboardMenu").innerHTML = `
      <a class="nav-link" href="dashboard.html">สรุปภาพรวม</a>
    `;
  }
}

/* =========================
   LOGOUT
========================= */
function logoutAdmin() {
  localStorage.removeItem("isAdminLogin");
  localStorage.removeItem("adminUsername");
  window.location.reload();
}
renderAuthButton();
renderAdminMenu();
  </script>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
