<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - จัดการเคส</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9; }
    .card { border-radius:16px; }
    .status-badge { padding:6px 12px; border-radius:999px; font-size:.88rem; font-weight:600; display:inline-block; }
    .status-default { background:#e2e3e5; color:#41464b; }
    .status-waiting { background:#fff3cd; color:#856404; }
    .status-progress { background:#cff4fc; color:#055160; }
    .status-found { background:#d1e7dd; color:#0f5132; }
    .status-cancel { background:#e2e3e5; color:#41464b; }
    .status-danger { background:#f8d7da; color:#842029; }
    .action-btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .table td,.table th { vertical-align:middle; }
  </style>
</head>
<body>
<script src="app.js"></script>
<script>guardAdmin('');</script>
<div id="appNavbar"></div>
<div class="container mt-4">
  <p class="text-muted text-center mb-4">หน้านี้สำหรับเจ้าหน้าที่ใช้ดูรายการเคส แก้ไขข้อมูล และเปิดดูรายละเอียดของเคส</p>
  <div class="card shadow p-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 class="mb-0">📋 รายการเคสคนหาย</h4>
      <button class="btn btn-outline-primary" onclick="loadCases()">รีเฟรช</button>
    </div>
    <div class="table-responsive">
      <table class="table table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>ID</th><th>ชื่อ</th><th>เหตุผล</th><th>ความเร่งด่วน</th><th>สถานะ</th><th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="caseTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="editCaseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <form id="editCaseForm">
        <div class="modal-header"><h5 class="modal-title">แก้ไขข้อมูลเคส</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="edit_case_id">
          <div class="mb-3"><label class="form-label">ชื่อผู้สูญหาย</label><input type="text" class="form-control" id="edit_missing_name" required></div>
          <div class="row">
            <div class="col-md-4 mb-3"><label class="form-label">เพศ</label><select class="form-select" id="edit_gender"><option value="">-- เลือก --</option><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option><option value="อื่น ๆ">อื่น ๆ</option></select></div>
            <div class="col-md-4 mb-3"><label class="form-label">อายุ</label><input type="number" class="form-control" id="edit_age"></div>
            <div class="col-md-4 mb-3"><label class="form-label">สัญชาติ</label><input type="text" class="form-control" id="edit_race"></div>
          </div>
          <div class="mb-3"><label class="form-label">หัวข้อการแจ้ง</label><input type="text" class="form-control" id="edit_missing_reason"></div>
          <div class="mb-3"><label class="form-label">ความเร่งด่วน</label><select class="form-select" id="edit_priority"><option value="กลาง">กลาง</option><option value="สูง">สูง</option><option value="สูงมาก">สูงมาก</option></select></div>
          <div class="mb-3"><label class="form-label">สถานะ</label><select class="form-select" id="edit_latest_status"></select></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึกการแก้ไข</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  renderNavbar({ mountId: 'appNavbar', basePath: '', active: 'admin' });
  const editModal = new bootstrap.Modal(document.getElementById('editCaseModal'));
  let caseList = [];
  document.getElementById('edit_latest_status').innerHTML = CASE_STATUS_FLOW.map(status => `<option value="${status}">${status}</option>`).join('');

  function viewCaseDetail(id) {
    window.location.href = `admin-case-detail.html?id=${id}`;
  }

  function openEditModal(id) {
    const item = caseList.find(row => String(getCaseId(row)) === String(id));
    if (!item) return;
    document.getElementById('edit_case_id').value = getCaseId(item);
    document.getElementById('edit_missing_name').value = item.missing_name || item.name || '';
    document.getElementById('edit_gender').value = item.gender || '';
    document.getElementById('edit_age').value = item.age || '';
    document.getElementById('edit_race').value = item.race || '';
    document.getElementById('edit_missing_reason').value = item.missing_reason || item.reason || '';
    document.getElementById('edit_priority').value = item.priority || 'กลาง';
    document.getElementById('edit_latest_status').value = normalizeStatus(item.latest_status);
    editModal.show();
  }

  async function loadCases() {
    caseList = await fetchCaseList();
    const tips = getStoredTips();
    const table = document.getElementById('caseTable');
    table.innerHTML = '';

    if (caseList.length === 0) {
      table.innerHTML = `<tr><td colspan="6">ไม่มีข้อมูล</td></tr>`;
      return;
    }

    caseList.forEach(item => {
      const caseId = getCaseId(item);
      let status = normalizeStatus(item.latest_status);
      if (tips.some(t => String(t.caseId) === String(caseId)) && status === 'รับเคส(บันทึกข้อมูลในระบบ)') {
        status = 'ได้รับแจ้งเบาะแสใหม่';
      }
      const meta = getStatusMeta(status);
      table.innerHTML += `
        <tr>
          <td>${caseId}</td>
          <td>${item.missing_name || item.name || '-'}</td>
          <td>${item.missing_reason || item.reason || '-'}</td>
          <td>${item.priority || '-'}</td>
          <td><span class="status-badge ${meta.badgeClass}">${meta.value}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn btn-warning btn-sm" onclick="openEditModal('${caseId}')">แก้ไข</button>
              <button class="btn btn-info btn-sm text-white" onclick="viewCaseDetail('${caseId}')">รายละเอียด</button>
            </div>
          </td>
        </tr>`;
    });
  }

  document.getElementById('editCaseForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('edit_case_id').value;
    const payload = {
      missing_name: document.getElementById('edit_missing_name').value,
      gender: document.getElementById('edit_gender').value,
      age: document.getElementById('edit_age').value ? Number(document.getElementById('edit_age').value) : null,
      race: document.getElementById('edit_race').value,
      missing_reason: document.getElementById('edit_missing_reason').value,
      priority: document.getElementById('edit_priority').value,
      latest_status: document.getElementById('edit_latest_status').value
    };
    await updateCaseById(id, payload);
    const cases = getStoredCases();
    const idx = cases.findIndex(item => String(getCaseId(item)) === String(id));
    if (idx >= 0) {
      cases[idx] = { ...cases[idx], ...payload };
      saveStoredCases(cases);
    }
    alert('บันทึกการแก้ไขสำเร็จ');
    editModal.hide();
    loadCases();
  });

  loadCases();
</script>
</body>
</html>
