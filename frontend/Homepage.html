<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ศูนย์ข้อมูลคนหาย</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appNavbar"></div>

<section class="banner">
    <h1>ภารกิจติดตาม<br><span>“คนหาย”</span></h1>
</section>

<main class="container my-4">
    <div class="row g-3">

        <div class="col-lg-8 col-md-12">
            <div class="left">

                <div class="filter d-flex flex-wrap gap-2 mb-3">
                    <select id="month" class="form-select w-auto">
                        <option value="8">สิงหาคม</option>
                        <option value="7">กรกฎาคม</option>
                    </select>

                    <input id="keyword"
                           class="form-control"
                           placeholder="ค้นหาชื่อบุคคล">

                    <button id="searchBtn" class="btn btn-primary">
                        ค้นหา
                    </button>
                </div>

                <div id="personList"></div>

                <div class="contact-box mt-4">
                    <h5>ติดต่อสอบถาม</h5>

                    <div class="contact-item">
                        <i class="fa-solid fa-phone"></i>
                        02-790-2630-3, 02-790-2111
                    </div>

                    <div class="contact-item">
                        <i class="fa-solid fa-location-dot"></i>
                        145 ถนนวิภาวดีรังสิต แขวงตลาดบางเขน เขตหลักสี่ กทม. 10210
                    </div>

                    <div class="contact-item">
                        <i class="fa-brands fa-facebook"></i>
                        ศูนย์คนหาย ไทยพีบีเอส
                    </div>

                    <div class="contact-item">
                        <i class="fa-solid fa-clock"></i>
                        จันทร์–ศุกร์ 9:00–16:00
                    </div>

                    <div class="contact-item">
                        <i class="fa-brands fa-line"></i>
                        @RongTookThaiPBS
                    </div>
                </div>

            </div>
        </div>

        <div class="col-lg-4 col-md-12">
            <div class="right">
                <h4>
                    <i class="fa-solid fa-location-pin"></i>
                    บุคคลสูญหายล่าสุด
                </h4>
                <img src="คนหาย1 1.png"
                     class="img-fluid rounded mt-2">
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar({ mountId: 'appNavbar', basePath: '', active: 'home' });
</script>
</body>
</html>
