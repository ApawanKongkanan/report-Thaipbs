<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามเคสคนหาย</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f4f6f9; }
    .case-card,.search-box,.empty-box { border:none; border-radius:18px; box-shadow:0 8px 20px rgba(0,0,0,.08); }
    .case-title { font-weight:700; color:#0b2c4d; }
    .status-badge { display:inline-block; padding:6px 12px; border-radius:999px; font-size:0.9rem; font-weight:600; }
    .status-default { background:#e2e3e5; color:#41464b; }
    .status-waiting { background:#fff3cd; color:#856404; }
    .status-progress { background:#cff4fc; color:#055160; }
    .status-found { background:#d1e7dd; color:#0f5132; }
    .status-cancel { background:#e2e3e5; color:#41464b; }
    .status-danger { background:#f8d7da; color:#842029; }
    .detail-box { background:#f8f9fa; border-radius:12px; padding:14px; height:100%; }
    .progress { height:22px; border-radius:999px; background:#e9ecef; }
    .case-photo-wrap {
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 14px;
      padding: 12px;
    }
    .case-photo {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      cursor: zoom-in;
    }
    .case-photo-empty { width:100%; min-height:240px; border-radius:14px; border:1px dashed #ced4da; display:flex; align-items:center; justify-content:center; color:#6c757d; background:#fff; }
    .image-preview-modal img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
<div id="appNavbar"></div>
<div class="container my-5">
  <div class="search-box p-4 mb-4">
    <h2 class="mb-3">ติดตามเคสคนหาย</h2>
    <p class="text-muted mb-4">ค้นหาข้อมูลผู้สูญหายเพื่อตรวจสอบรายละเอียดและความคืบหน้าของเคส</p>
    <div class="row g-3 align-items-end" id="searchSection">
      <div class="col-md-9">
        <label class="form-label">ค้นหาชื่อผู้สูญหาย</label>
        <input type="text" id="searchInput" class="form-control" placeholder="พิมพ์ชื่อผู้สูญหาย">
      </div>
      <div class="col-md-3 d-grid"><button type="button" class="btn btn-primary" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button></div>
    </div>
  </div>
  <div id="resultBox"></div>
</div>
<script src="app.js"></script>
<script>
  renderNavbar({ mountId: 'appNavbar', basePath: '', active: 'track' });
  const params = new URLSearchParams(window.location.search);
  const caseIdFromUrl = params.get('case_id');
  const familyCaseId = localStorage.getItem('familyCaseId');

  function renderCases(cases) {
    const resultBox = document.getElementById('resultBox');
    if (!cases || cases.length === 0) {
      resultBox.innerHTML = `<div class="empty-box p-5 text-center text-muted"><h4 class="mb-2">ไม่พบข้อมูลเคส</h4><p class="mb-0">ลองค้นหาด้วยชื่ออื่น หรือกลับไปตรวจสอบข้อมูลอีกครั้ง</p></div>`;
      return;
    }

    const tips = getStoredTips();
    resultBox.innerHTML = cases.map(item => {
      const caseId = getCaseId(item);
      const meta = getStatusMeta(item.latest_status || (tips.some(t => String(t.caseId) === String(caseId)) ? 'ได้รับแจ้งเบาะแสใหม่' : 'รับเคส(บันทึกข้อมูลในระบบ)'));
      const relatedTips = tips.filter(t => String(t.caseId) === String(caseId));
      const imageUrl = getCaseImageUrl(item);
      return `
        <div class="card case-card mb-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
              <div>
                <div class="text-muted small">เลขเคส: ${caseId}</div>
                <h4 class="case-title mb-1">${item.missing_name || item.name || '-'}</h4>
                <div class="text-muted">หัวข้อ: ${item.missing_reason || item.reason || '-'} | ความเร่งด่วน: ${item.priority || '-'}</div>
              </div>
              <div><span class="status-badge ${meta.badgeClass}">${meta.value}</span></div>
            </div>
            <div class="mb-4">
              <div class="d-flex justify-content-between mb-2"><span class="fw-semibold">ความคืบหน้าของเคส</span><span class="fw-semibold">${meta.progress}%</span></div>
              <div class="progress"><div class="progress-bar ${meta.progressClass}" role="progressbar" style="width:${meta.progress}%">${meta.progress}%</div></div>
            </div>
            <div class="mb-4 case-photo-wrap">
              ${imageUrl
                ? `<img src="${imageUrl}" alt="รูปผู้สูญหาย" class="case-photo" onclick="openImagePreview('${imageUrl}')">`
                : `<div class="case-photo-empty">ไม่มีรูปภาพ</div>`}
            </div>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><div class="detail-box"><div><strong>เพศ:</strong> ${item.gender || '-'}</div><div><strong>อายุ:</strong> ${item.age || '-'}</div><div><strong>วันที่หาย:</strong> ${item.missing_date || '-'}</div><div><strong>เวลาที่หาย:</strong> ${item.missing_time || '-'}</div></div></div>
              <div class="col-md-6"><div class="detail-box"><div><strong>สถานที่:</strong> ${item.missing_place || '-'}</div><div><strong>จังหวัด:</strong> ${item.province || '-'}</div><div><strong>ผู้แจ้ง:</strong> ${item.owner_name || '-'}</div><div><strong>ติดต่อ:</strong> ${item.owner_phone || '-'}</div></div></div>
            </div>
            <div class="detail-box">
              <strong>เบาะแสล่าสุด</strong>
              <div class="mt-2">${relatedTips.length ? relatedTips.map(t => `<div class="mb-2">- ${t.tip_location || '-'} (${t.tip_date || '-'})</div>`).join('') : 'ยังไม่มีข้อมูลเบาะแสเพิ่มเติม'}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  async function loadByCaseId(caseId) {
    const item = await fetchCaseById(caseId);
    renderCases(item ? [item] : []);
  }

  async function searchCases() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const rows = await fetchCaseList();
    const filtered = rows.filter(item => (item.missing_name || item.name || '').toLowerCase().includes(keyword));
    renderCases(filtered);
  }

  document.getElementById('searchBtn').addEventListener('click', searchCases);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      searchCases();
    }
  });

  if (isFamilyLogin()) {
    document.getElementById('searchSection').style.display = 'none';
    loadByCaseId(caseIdFromUrl || familyCaseId);
  } else if (caseIdFromUrl) {
    loadByCaseId(caseIdFromUrl);
  }
</script>
<div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content image-preview-modal">
      <div class="modal-header">
        <h5 class="modal-title">ดูรูปภาพ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img id="previewImage" src="" alt="Preview">
      </div>
    </div>
  </div>
</div>
<script>
  function openImagePreview(src) {
    const preview = document.getElementById("previewImage");
    preview.src = src;
    const modal = new bootstrap.Modal(document.getElementById("imagePreviewModal"));
    modal.show();
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
