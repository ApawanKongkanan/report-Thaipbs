<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามเคสคนหาย</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f4f6f9;
    }

    .case-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .case-title {
      font-weight: 700;
      color: #0b2c4d;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status-waiting {
      background: #fff3cd;
      color: #856404;
    }

    .status-progress {
      background: #cff4fc;
      color: #055160;
    }

    .status-found {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status-default {
      background: #e2e3e5;
      color: #41464b;
    }

    .search-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .empty-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 40px 24px;
      text-align: center;
      color: #6c757d;
    }

    .detail-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 14px;
      height: 100%;
    }

    .progress {
      height: 22px;
      border-radius: 999px;
      background: #e9ecef;
    }

    .progress-bar {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0b2c4d;">
    <div class="container-fluid">
  
      <!-- LOGO -->
      <a class="navbar-brand d-flex align-items-center gap-2"
         href="Homepage.html">
        <img src="LOGO ThaiPBS.png" height="40">
        <span class="fw-bold">ศูนย์ข้อมูลคนหาย</span>
      </a>
  
      <!-- TOGGLE BUTTON -->
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
  
      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-end" id="mainMenu">
        <ul class="navbar-nav align-items-lg-center gap-2">
  
          <li class="nav-item">
            <a class="nav-link" href="Homepage.html">หน้าหลัก</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="report-missing-step/report-missing-step.html">แจ้งคนหาย</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="tip-form.html">แจ้งเบาะแส</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link active" href="track-case.html">ติดตามเคส</a>
          </li>
  
          <li class="nav-item">
            <a class="nav-link" href="admin.html">สำหรับเจ้าหน้าที่</a>
          </li>
  
          <li class="nav-item ms-lg-3">
            <button class="btn btn-outline-light rounded-pill">
              <i class="fa-solid fa-user"></i> เข้าสู่ระบบ
            </button>
          </li>
  
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container my-5">
    <div class="search-box mb-4">
      <h2 class="mb-3">ติดตามเคสคนหาย</h2>
      <p class="text-muted mb-4">
        ค้นหาจากชื่อผู้สูญหายเพื่อดูสถานะล่าสุด ความคืบหน้าของเคส และแจ้งเบาะแสเพิ่มเติม
      </p>

      <div class="row g-3 align-items-end">
        <div class="col-md-9">
          <label class="form-label">ค้นหาชื่อผู้สูญหาย</label>
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="พิมพ์ชื่อผู้สูญหาย"
          >
        </div>
        <div class="col-md-3 d-grid">
          <button type="button" class="btn btn-primary" id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
          </button>
        </div>
      </div>
    </div>

    <div id="resultBox"></div>
  </div>

  <script>
    const API = "http://localhost:3000/api/missing-persons";

    function getStatusClass(status) {
      if (!status) return "status-default";
      if (status.includes("รับแจ้ง")) return "status-waiting";
      if (status.includes("กำลังตรวจสอบ") || status.includes("ประชาสัมพันธ์")) return "status-progress";
      if (status.includes("พบเบาะแส") || status.includes("พบแล้ว")) return "status-found";
      return "status-default";
    }

    function getProgressPercent(status) {
      if (!status) return 10;
      if (status.includes("รับแจ้ง")) return 25;
      if (status.includes("กำลังตรวจสอบ")) return 50;
      if (status.includes("ประชาสัมพันธ์")) return 75;
      if (status.includes("พบเบาะแส") || status.includes("พบแล้ว")) return 100;
      return 10;
    }

    function getProgressColorClass(percent) {
      if (percent < 50) return "bg-warning";
      if (percent < 100) return "bg-info";
      return "bg-success";
    }

    function renderCases(cases) {
      const resultBox = document.getElementById("resultBox");

      if (!cases || cases.length === 0) {
        resultBox.innerHTML = `
          <div class="empty-box">
            <i class="fa-regular fa-face-frown fa-2x mb-3"></i>
            <h4 class="mb-2">ไม่พบข้อมูลเคส</h4>
            <p class="mb-0">ลองค้นหาด้วยชื่ออื่น หรือกลับไปแจ้งข้อมูลใหม่อีกครั้ง</p>
          </div>
        `;
        return;
      }

      resultBox.innerHTML = cases.map(item => {
        const status = item.latest_status || "รับแจ้งเคส";
        const progress = getProgressPercent(status);
        const statusClass = getStatusClass(status);
        const progressClass = getProgressColorClass(progress);

        return `
          <div class="card case-card">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
                <div>
                  <div class="text-muted small">เลขเคส: ${item.case_id ?? "-"}</div>
                  <h4 class="case-title mb-1">${item.missing_name || "-"}</h4>
                  <div class="text-muted">
                    หัวข้อ: ${item.missing_reason || "-"} | ความเร่งด่วน: ${item.priority || "-"}
                  </div>
                </div>

                <div>
                  <span class="status-badge ${statusClass}">
                    ${status}
                  </span>
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between mb-2">
                  <span class="fw-semibold">ความคืบหน้าของเคส</span>
                  <span class="fw-semibold">${progress}%</span>
                </div>
                <div class="progress">
                  <div class="progress-bar ${progressClass}" role="progressbar" style="width: ${progress}%;">
                    ${progress}%
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <div class="detail-box">
                    <div><strong>เพศ:</strong> ${item.gender || "-"}</div>
                    <div><strong>อายุ:</strong> ${item.age || "-"}</div>
                    <div><strong>สัญชาติ:</strong> ${item.race || "-"}</div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="detail-box">
                    <div><strong>ความสัมพันธ์ผู้แจ้ง:</strong> ${item.relation_to_missing || "-"}</div>
                    <div><strong>ช่องทางการแจ้ง:</strong> ${item.inform_channels || "-"}</div>
                    <div><strong>สถานะล่าสุด:</strong> ${status}</div>
                  </div>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2">
                <a href="tip-form.html?case_id=${item.case_id}" class="btn btn-primary">
                  <i class="fa-solid fa-lightbulb"></i> แจ้งเบาะแส
                </a>
                <button type="button" class="btn btn-outline-secondary" onclick="viewCaseDetail(${item.case_id})">
                  <i class="fa-solid fa-circle-info"></i> ดูรายละเอียด
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function viewCaseDetail(caseId) {
      window.location.href = `admin-case-detail.html?id=${caseId}`;
    }

    async function loadCasesByName(name = "") {
      const resultBox = document.getElementById("resultBox");
      resultBox.innerHTML = `
        <div class="empty-box">
          <div class="spinner-border text-primary mb-3" role="status"></div>
          <div>กำลังโหลดข้อมูล...</div>
        </div>
      `;

      try {
        const res = await fetch(API);
        const result = await res.json();

        const rows = Array.isArray(result) ? result : (result.data || []);

        let filtered = rows;

        if (name.trim()) {
          const keyword = name.trim().toLowerCase();
          filtered = rows.filter(item =>
            (item.missing_name || "").toLowerCase().includes(keyword)
          );
        }

        renderCases(filtered);
      } catch (error) {
        console.error("LOAD TRACK CASE ERROR:", error);
        resultBox.innerHTML = `
          <div class="empty-box">
            <i class="fa-solid fa-triangle-exclamation fa-2x mb-3"></i>
            <h4 class="mb-2">ไม่สามารถโหลดข้อมูลได้</h4>
            <p class="mb-0">กรุณาตรวจสอบว่า backend เปิดอยู่และเชื่อมต่อได้</p>
          </div>
        `;
      }
    }

    function handleSearch() {
      const name = document.getElementById("searchInput").value || "";
      loadCasesByName(name);
    }

    document.getElementById("searchBtn").addEventListener("click", handleSearch);

    document.getElementById("searchInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSearch();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const nameFromQuery = params.get("name") || "";

    if (nameFromQuery) {
      document.getElementById("searchInput").value = nameFromQuery;
      loadCasesByName(nameFromQuery);
    } else {
      loadCasesByName();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
