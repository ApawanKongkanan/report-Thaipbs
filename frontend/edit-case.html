<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แก้ไขข้อมูลเคส</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      padding: 30px;
    }

    .card {
      border-radius: 20px;
      border: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>แก้ไขข้อมูลเคส</h2>

    <a href="admin.html" class="btn btn-secondary">
      กลับหน้าแอดมิน
    </a>
  </div>

  <div class="card p-4">

    <form id="editForm">

      <div class="mb-3">
        <label class="form-label">ชื่อผู้สูญหาย</label>
        <input type="text" class="form-control" id="missing_name">
      </div>

      <div class="mb-3">
        <label class="form-label">เพศ</label>
        <input type="text" class="form-control" id="gender">
      </div>

      <div class="mb-3">
        <label class="form-label">อายุ</label>
        <input type="number" class="form-control" id="age">
      </div>

      <div class="mb-3">
        <label class="form-label">เชื้อชาติ</label>
        <input type="text" class="form-control" id="race">
      </div>

      <div class="mb-3">
        <label class="form-label">สาเหตุการหาย</label>
        <textarea class="form-control" id="missing_reason"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">ระดับความสำคัญ</label>
        <select class="form-select" id="priority">
          <option value="ต่ำ">ต่ำ</option>
          <option value="กลาง">กลาง</option>
          <option value="สูง">สูง</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">
        บันทึกข้อมูล
      </button>

    </form>

  </div>

</div>

<script>

const API = "http://localhost:3000/api/missing-persons";

const params = new URLSearchParams(window.location.search);

const caseId = params.get("id");

async function loadCase() {

  try {

    const res = await fetch(`${API}/${caseId}`);

    const result = await res.json();

    const item = result.data;

    document.getElementById("missing_name").value = item.missing_name || "";
    document.getElementById("gender").value = item.gender || "";
    document.getElementById("age").value = item.age || "";
    document.getElementById("race").value = item.race || "";
    document.getElementById("missing_reason").value = item.missing_reason || "";
    document.getElementById("priority").value = item.priority || "กลาง";

  } catch (err) {

    console.error(err);

    alert("โหลดข้อมูลไม่สำเร็จ");

  }

}

loadCase();

// submit update

document.getElementById("editForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    try {

      const body = {
        missing_name: document.getElementById("missing_name").value,
        gender: document.getElementById("gender").value,
        age: document.getElementById("age").value,
        race: document.getElementById("race").value,
        missing_reason: document.getElementById("missing_reason").value,
        priority: document.getElementById("priority").value
      };

      const res = await fetch(`${API}/${caseId}`, {

        method: "PUT",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(body)

      });

      const result = await res.json();

      if (result.success) {

        alert("บันทึกสำเร็จ");

        window.location.href = "admin.html";

      } else {

        alert("เกิดข้อผิดพลาด");

      }

    } catch (err) {

      console.error(err);

      alert("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");

    }

  });

</script>

</body>
</html>
