<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบแอดมิน</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0b2c4d, #1e4d7a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    .brand-title {
      color: #0b2c4d;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <img src="LOGO ThaiPBS.png" height="56" alt="logo" class="mb-3">
      <h3 class="brand-title mb-1">เข้าสู่ระบบแอดมิน</h3>
      <p class="text-muted mb-0">สำหรับเจ้าหน้าที่ผู้ดูแลระบบเท่านั้น</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">ชื่อผู้ใช้</label>
        <input type="text" class="form-control" id="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <div id="loginError" class="alert alert-danger d-none py-2" role="alert">
        ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
        </button>
        <a href="Homepage.html" class="btn btn-outline-secondary">
          กลับหน้าหลัก
        </a>
      </div>
    </form>
  </div>

  <script>
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "1234";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const loginError = document.getElementById("loginError");

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        localStorage.setItem("isAdminLogin", "true");
        localStorage.setItem("adminUsername", username);
        window.location.href = "dashboard.html";
      } else {
        loginError.classList.remove("d-none");
      }
    });
  </script>

</body>
</html>
