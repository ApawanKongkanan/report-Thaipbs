<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0b2c4d, #1e4d7a);
      min-height: 100vh;
    }
    .login-wrap { max-width: 980px; }
    .login-card {
      border: none;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0,0,0,.16);
      height: 100%;
    }
    .brand-title { color:#0b2c4d; font-weight:700; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="login-wrap mx-auto">
      <div class="text-center text-white mb-4">
        <img src="LOGO ThaiPBS.png" height="60" alt="logo" class="mb-3">
        <h2 class="fw-bold mb-2">เข้าสู่ระบบ</h2>
        <p class="mb-0">เลือกประเภทผู้ใช้งานให้ตรงกับการใช้งานของคุณ</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card login-card p-4">
            <div class="mb-4 text-center">
              <h3 class="brand-title mb-1">เข้าสู่ระบบสำหรับ Admin</h3>
              <p class="text-muted mb-0">สำหรับดูแดชบอร์ด จัดการเคส และแก้ไขข้อมูล</p>
            </div>
            <form id="adminLoginForm">
              <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้</label>
                <input type="text" class="form-control" id="adminUsername" required>
              </div>
              <div class="mb-3">
                <label class="form-label">รหัสผ่าน</label>
                <input type="password" class="form-control" id="adminPassword" required>
              </div>
              <div id="adminLoginError" class="alert alert-danger d-none py-2">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ Admin</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card login-card p-4">
            <div class="mb-4 text-center">
              <h3 class="brand-title mb-1">เข้าสู่ระบบสำหรับญาติผู้แจ้ง</h3>
              <p class="text-muted mb-0">ใช้เพื่อติดตามเคสของตนเองเท่านั้น</p>
            </div>
            <form id="familyLoginForm">
              <div class="mb-3">
                <label class="form-label">เลขเคส</label>
                <input type="text" class="form-control" id="familyCaseId" required>
              </div>
              <div class="mb-3">
                <label class="form-label">เบอร์โทรศัพท์ผู้แจ้ง</label>
                <input type="tel" class="form-control" id="familyPhone" maxlength="10" placeholder="เช่น 0812345678" required>
              </div>
              <div id="familyLoginError" class="alert alert-danger d-none py-2">ไม่พบข้อมูลที่ตรงกัน กรุณาตรวจสอบเลขเคสและเบอร์โทรศัพท์</div>
              <div class="d-grid">
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-user-check"></i> เข้าสู่ระบบญาติผู้แจ้ง</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="Homepage.html" class="btn btn-outline-light rounded-pill">กลับหน้าหลัก</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "1234";

    document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("adminUsername").value.trim();
      const password = document.getElementById("adminPassword").value.trim();
      const error = document.getElementById("adminLoginError");

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        clearFamilyAuth();
        localStorage.setItem("isAdminLogin", "true");
        localStorage.setItem("adminUsername", username);
        window.location.href = "admin.html";
      } else {
        error.classList.remove("d-none");
      }
    });

    document.getElementById("familyLoginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const caseId = document.getElementById("familyCaseId").value.trim();
      const phone = document.getElementById("familyPhone").value.trim();
      const error = document.getElementById("familyLoginError");
      error.classList.add("d-none");

      const caseItem = await fetchCaseById(caseId);
      if (caseItem && String(caseItem.owner_phone || "") === phone) {
        clearAdminAuth();
        localStorage.setItem("isFamilyLogin", "true");
        localStorage.setItem("familyCaseId", String(getCaseId(caseItem)));
        localStorage.setItem("familyOwnerPhone", phone);
        window.location.href = `track-case.html?case_id=${getCaseId(caseItem)}`;
        return;
      }

      error.classList.remove("d-none");
    });
  </script>
</body>
</html>
