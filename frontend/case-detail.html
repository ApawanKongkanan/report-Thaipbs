<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>รายละเอียดเคส</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body {
      background: #f4f6f9;
      padding: 30px;
    }

    .card {
      border-radius: 20px;
      border: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

  </style>

</head>

<body>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>รายละเอียดเคส</h2>

    <a href="admin.html"
       class="btn btn-secondary">

      กลับหน้าแอดมิน

    </a>

  </div>

  <div class="card p-4">

    <div id="loadingText">

      กำลังโหลดข้อมูล...

    </div>

    <div id="caseData"
         class="d-none">

      <div class="row g-4">

        <div class="col-md-4 text-center">

          <img id="caseImage"
               class="img-fluid rounded"
               style="max-height:350px; object-fit:cover;">

        </div>

        <div class="col-md-8">

          <h3 id="missingName"></h3>

          <hr>

          <p><strong>เพศ:</strong>
            <span id="gender"></span>
          </p>

          <p><strong>อายุ:</strong>
            <span id="age"></span>
          </p>

          <p><strong>เชื้อชาติ:</strong>
            <span id="race"></span>
          </p>

          <p><strong>สาเหตุการหาย:</strong>
            <span id="reason"></span>
          </p>

          <p><strong>สถานะ:</strong>
            <span id="status"></span>
          </p>

          <p><strong>ผู้แจ้ง:</strong>
            <span id="owner"></span>
          </p>

          <p><strong>เบอร์ผู้แจ้ง:</strong>
            <span id="phone"></span>
          </p>

          <p><strong>จังหวัด:</strong>
            <span id="province"></span>
          </p>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

const API =
  "http://localhost:3000/api/missing-persons";

const params =
  new URLSearchParams(window.location.search);

const caseId =
  params.get("id");

async function loadCaseDetail() {

  try {

    const res =
      await fetch(`${API}/${caseId}`);

    const result =
      await res.json();

    if (!result.success) {

      alert("ไม่พบข้อมูล");

      return;

    }

    const item = result.data;

    document.getElementById("loadingText")
      .classList.add("d-none");

    document.getElementById("caseData")
      .classList.remove("d-none");

    document.getElementById("missingName").innerText =
      `${item.missing_title || ''} ${item.missing_name || '-'}`;

    document.getElementById("gender").innerText =
      item.gender || "-";

    document.getElementById("age").innerText =
      item.age || "-";

    document.getElementById("race").innerText =
      item.race || "-";

    document.getElementById("reason").innerText =
      item.missing_reason || "-";

    document.getElementById("status").innerText =
      item.latest_status || "-";

    document.getElementById("owner").innerText =
      `${item.owner_title || ''} ${item.owner_name || '-'}`;

    document.getElementById("phone").innerText =
      item.owner_phone || "-";

    document.getElementById("province").innerText =
      item.province || "-";

    document.getElementById("caseImage").src =
      item.missing_person_image
        ? `http://localhost:3000/${item.missing_person_image}`
        : "no-image.jpg";

  } catch (err) {

    console.error(err);

    alert("โหลดข้อมูลไม่สำเร็จ");

  }

}

loadCaseDetail();

</script>

</body>
</html>
